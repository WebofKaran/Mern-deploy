services:
  server:
    build: ./server
    container_name: mern-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5000
    ports:
      - "5000:5000"

  client:
    build: ./client
    container_name: mern-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"
