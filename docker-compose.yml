services:
  mongo:
    image: mongo:8
    container_name: mern-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: mern-server
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/mern_deploy_lab
      PORT: 5000
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  client:
    build: ./client
    container_name: mern-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mongo-data:
